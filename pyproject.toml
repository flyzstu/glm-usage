[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glm-usage"
version = "1.0.0"
description = "High-performance Sanic service that exposes bigmodel.cn (GLM) usage data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sanic>=23.12",
    "httpx>=0.27",
    "orjson>=3.9",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "sanic-testing>=23.12",
]

[project.scripts]
glm-usage = "glm_usage.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["glm_usage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
ignore = [
    "B008",   # Sanic 的 @app.get(...) 就是函数调用形式的依赖注入
    "RET504", # 先赋值再 return 有时更易读
]

[tool.ruff.lint.per-file-ignores]
# 测试里的 httpx handler 必须保持 (request) 签名
"tests/*" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["glm_usage"]

