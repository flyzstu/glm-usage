name: Build container image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: coding.fly97.fun:8443
      IMAGE: coding.fly97.fun:8443/fly97/glm-usage
      IMAGE_TAG: ${{ gitea.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull --tag "$IMAGE:$IMAGE_TAG" .

      - name: Log in to Gitea container registry
        if: gitea.event_name == 'push' || gitea.event_name == 'workflow_dispatch'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin

      - name: Push image tags
        if: gitea.event_name == 'push' || gitea.event_name == 'workflow_dispatch'
        run: |
          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

          # 再推一个和 pyproject.toml 一致的版本 tag：k8s 清单里钉的是它，
          # 这样回滚、diff 都有确定的版本号可依，不用靠 :latest 猜。
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ -n "$VERSION" ]; then
            docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
            echo "pushed $IMAGE:$VERSION"
          fi
