---
# glm-usage-secret 模板 —— 只做说明用，真正的 Secret 由 deploy.sh 从 .env 生成。
# 手动创建（别把真值提交进 git）：
#   kubectl -n default create secret generic glm-usage-secret \
#     --from-file=BIGMODEL_TOKEN=./token --from-literal=GLM_USAGE_API_KEY=xxx
apiVersion: v1
kind: Secret
metadata:
  name: glm-usage-secret
  namespace: default
  labels:
    app: glm-usage
type: Opaque
stringData:
  # bigmodel.cn 的 bigmodel_token_production（JWT，不带 Bearer 前缀）
  BIGMODEL_TOKEN: ""
  # 可选：本服务自己的钥匙，客户端需带 X-API-Key（或 ?key=）
  GLM_USAGE_API_KEY: ""
