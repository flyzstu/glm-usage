---
# GLM Usage —— bigmodel.cn 用量只读服务 + 看板
# 镜像源: Gitea 自带容器 registry coding.fly97.fun:8443（CI 构建后推到这里，
#         见 ../.gitea/workflows/build-image.yaml；deploy.sh 是手动/本地那条路）
# 部署: ../k8s/deploy.sh（先从 .env 生成 glm-usage-secret，再 apply 本文件）
# 看板: https://glm-usage.fly97.fun/dashboard?key=<GLM_USAGE_API_KEY>（带一次 key，面板会存进 localStorage）
#
# 配置分两处，与 .env / .env.example 的对应关系：
#   下面的 ConfigMap  = .env 里生效的非敏感项，外加 .env.example 里多出的三个
#                       （DASHBOARD_PATH / SUMMARY_MAX_AGE / REFRESH_MIN_INTERVAL，
#                        值就是应用默认值，写出来是为了部署清单自己看得明白）
#   glm-usage-secret  = .env 与 .env.example 的真正差异，即那两个真值：
#                       BIGMODEL_TOKEN（.env.example 里是空的）和
#                       GLM_USAGE_API_KEY（.env.example 里是注释掉的），deploy.sh 现场生成
apiVersion: v1
kind: ConfigMap
metadata:
  name: glm-usage-config
  namespace: default
  labels:
    app: glm-usage
data:
  # 监听地址 / 端口 / 进程数
  GLM_USAGE_HOST: "0.0.0.0"
  GLM_USAGE_PORT: "8000"
  # 单 worker：每个 worker 有独立缓存，多开一个就多一份上游调用（实测翻倍），
  # 而单进程的吞吐早就远超这个面板的需要。多副本同理，见 Deployment 的 replicas。
  GLM_USAGE_WORKERS: "1"

  # 上游 HTTP 行为
  GLM_USAGE_REQUEST_TIMEOUT: "15"
  GLM_USAGE_CONNECT_TIMEOUT: "5"
  GLM_USAGE_MAX_CONNECTIONS: "32"
  GLM_USAGE_MAX_KEEPALIVE_CONNECTIONS: "16"
  GLM_USAGE_RETRIES: "2"

  # 缓存（秒）。文档建议对上游的采集间隔 >= 60s（站点有 WAF），所以 quota 默认 60s；
  # usage/activity/performance 是按天聚合的数据，account 更是很少变。
  GLM_USAGE_QUOTA_TTL: "60"
  GLM_USAGE_USAGE_TTL: "300"
  GLM_USAGE_ACTIVITY_TTL: "300"
  GLM_USAGE_PERFORMANCE_TTL: "300"
  GLM_USAGE_ACCOUNT_TTL: "3600"

  # 上游故障时旧值还能用多久（.env 里放宽到了 1800，.env.example 是 600）
  GLM_USAGE_STALE_TTL: "1800"

  # 同一把 key 两次 ?refresh=1 之间的最小间隔（秒）；0 = 不限制。
  # 强制刷新会绕过缓存，没有这个闸门的话一个 while 循环就能把上游打穿。
  GLM_USAGE_REFRESH_MIN_INTERVAL: "30"

  # 默认查询窗口
  GLM_USAGE_DEFAULT_USAGE_DAYS: "7"
  GLM_USAGE_DEFAULT_ACTIVITY_DAYS: "30"
  GLM_USAGE_DASHBOARD_REFRESH_SECONDS: "30"

  # /api/v1/summary 接受的缓存最大年龄（秒）：超过就重新取，取不到就报错，
  # 而不是把很旧的数字当当前值返回。可用 ?maxAge= 逐次覆盖。
  GLM_USAGE_SUMMARY_MAX_AGE: "300"

  # 面板路径（故意不放在根路径，方便在反代/中间件里按路径加授权；/ 会 302 到这里）
  GLM_USAGE_DASHBOARD_PATH: "/dashboard"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-usage
  namespace: default
  labels:
    app: glm-usage
spec:
  # 固定 1 副本：缓存是进程内的，副本之间不共享，多一份就多一份上游采集量。
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: glm-usage
  strategy:
    # Recreate 而不是 RollingUpdate：滚动更新会出现新旧两个 Pod 并存，
    # 等于短时间内对上游双倍采集（站点有 WAF），所以先停旧的再起新的。
    type: Recreate
  template:
    metadata:
      labels:
        app: glm-usage
      annotations:
        # 集群里装了 stakater/reloader：改上面的 ConfigMap 或 Secret 后自动滚动重启，
        # 省得手动 kubectl rollout restart。
        reloader.stakater.com/auto: "true"
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001          # Dockerfile 里的 glm 用户
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: glm-usage
        image: coding.fly97.fun:8443/fly97/glm-usage:0.1.2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: glm-usage-config
        env:
        # 两个敏感值放 Secret；deploy.sh 会直接从 .env 生成 glm-usage-secret。
        - name: BIGMODEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: glm-usage-secret
              key: BIGMODEL_TOKEN
        - name: GLM_USAGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: glm-usage-secret
              key: GLM_USAGE_API_KEY
              optional: true        # 不设就是开放访问，别让它挡住启动
        # 想换 token 不重启，用 Secret 挂文件 + BIGMODEL_TOKEN_FILE：
        #   env:
        #   - name: BIGMODEL_TOKEN_FILE
        #     value: /run/secrets/bigmodel/token
        #   volumeMounts:
        #   - name: token
        #     mountPath: /run/secrets/bigmodel
        #     readOnly: true
        # volumes:
        # - name: token
        #   secret:
        #     secretName: glm-usage-secret
        #     items:
        #     - key: BIGMODEL_TOKEN
        #       path: token
        # kubelet 更新挂载文件后 mtime 变化，服务会自动重读（约 1 分钟内）。
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true   # 服务本身不写盘，见 docker-compose 的 read_only
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi          # 实测常驻约 105MiB
          limits:
            cpu: 500m
            memory: 512Mi
        # /healthz 不碰上游，且 token 缺失/过期时仍返回 200（只在 body 里标 degraded），
        # 所以探针失败只说明进程真挂了，不会因为上游抖动或 token 过期而反复重启。
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30     # 最多容忍 60s 启动
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi

---
# 集群内部服务 (http://glm-usage.default.svc.cluster.local:8000)
apiVersion: v1
kind: Service
metadata:
  name: glm-usage
  namespace: default
  labels:
    app: glm-usage
spec:
  type: ClusterIP
  selector:
    app: glm-usage
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP

---
# 外部访问: Traefik IngressRoute（*.fly97.fun 已经解析到 Traefik 的 192.168.0.32）
# 服务自带 X-API-Key 校验，所以默认不挂 Authelia；想统一走 SSO 就放开 middlewares。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: glm-usage
  namespace: default
  labels:
    app: glm-usage
spec:
  entryPoints:
  - https
  routes:
  - kind: Rule
    match: Host(`glm-usage.fly97.fun`)
    middlewares: []      # 需要 SSO 时: - name: authelia-forwardauth
    services:
    - name: glm-usage
      port: 8000
  tls: {}

---
# 不想走 Traefik、想直接用内网 IP 访问时，把上面的 IngressRoute 注释掉换成这个
# （MetalLB 会分配一个 192.168.0.x 地址）：
